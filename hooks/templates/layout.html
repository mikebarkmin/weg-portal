<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body, html {
            border: 0;
            margin: 0;
            padding: 0;
        }
        body {
            padding: 20px;
        }
        .wrapper {
            max-width: 600px;
            margin: auto;
            word-break: break-word;
            color: #272d35;
            font-size: 14px;
            line-height: 20px;
            font-family: Source Sans Pro, sans-serif, emoji;
        }
        p {
            display: block;
            margin: 10px 0;
            font-family: inherit;
        }
        hr {
            display: block;
            height: 1px;
            border: 0;
            width: 100%;
            background: #dadfe7;
            margin: 20px 0;
        }
        blockquote {
            margin: 10px 0;
            padding: 10px 15px;
            background: #f0f2f5;
            border-radius: 10px;
        }
        small {
            font-size: 12px;
            line-height: 16px;
            color: #687889;
        }
    </style>
</head>
<body>
    <div class="wrapper">{{block "body" .}}{{end}}</div>
</body>
</html>
