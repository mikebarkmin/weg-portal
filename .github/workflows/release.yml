name: Release

# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0):
#   1. runs every check (Go vet + tests, UI lint + tests + build),
#   2. publishes a GitHub release with static binaries (amd64 + arm64),
#   3. copies the matching binary to the server and runs
#      "sudo weg-portal-ctl deploy <version>" there: consistent backup of
#      pb_data, switch, health check, automatic rollback of binary AND data
#      if the new version does not come up (deploy/weg-portal-ctl).
#
# The server is prepared once with deploy/server-setup.sh (docs/deploy.md).
# Running the workflow by hand with an existing tag and "deploy only"
# redeploys that version.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0
        required: true
      deploy_only:
        description: Only deploy this already released version (rollback)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Tests
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}

      - name: Check the version tag
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a version tag like v1.2.3"; exit 1 ;;
          esac

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI lint, tests and build
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # the Go tests embed the freshly built UI (ui/dist)
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./... -count=1

  release:
    name: Build and publish
    needs: check
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # static binaries for running without Docker (attached to the release)
      - name: Build binaries
        run: |
          (cd ui && npm ci && npm run build)
          mkdir -p out
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION" \
              -o "out/weg-portal-$VERSION-linux-$arch" ./base
          done
          "./out/weg-portal-$VERSION-linux-amd64" --version
          (cd out && sha256sum weg-portal-* > SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" out/* --clobber
          else
            gh release create "$VERSION" out/* --verify-tag --generate-notes --title "$VERSION"
          fi

  deploy:
    name: Deploy to the server
    needs: release
    # also runs when "deploy only" skipped the build jobs, never after a failure
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    env:
      # BatchMode stops ssh dropping to an interactive password prompt, which
      # turns a rejected key into a clear failure instead of "please try again".
      SSH_OPTS: -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
      TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
      CTL: sudo -n /usr/local/sbin/weg-portal-ctl

    steps:
      # the tag ends up in a remote shell command; "deploy only" skips the
      # check job, so the format is verified here as well
      - name: Check the version tag
        run: |
          if ! printf '%s' "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?'; then
            echo "::error::Not a version tag like v1.2.3"
            exit 1
          fi

      - name: Check configuration
        run: |
          missing=""
          [ -n "${{ secrets.DEPLOY_SSH_HOST }}" ] || missing="$missing DEPLOY_SSH_HOST(secret)"
          [ -n "${{ secrets.DEPLOY_SSH_USER }}" ] || missing="$missing DEPLOY_SSH_USER(secret)"
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing="$missing DEPLOY_SSH_KEY(secret)"
          [ -n "${{ vars.DEPLOY_HOST }}" ] || missing="$missing DEPLOY_HOST(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured. Missing:$missing"
            exit 1
          fi

      - name: Add deploy key
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # printf, not echo: OpenSSH rejects a key whose final line has no
          # newline, which is the usual way this secret goes wrong.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! why=$(ssh-keygen -y -P "" -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            case "$why" in
              *passphrase*)
                echo "::error::DEPLOY_SSH_KEY has a passphrase, so it cannot be used"
                echo "::error::unattended. Generate a deploy key with an empty one:"
                echo "::error::  ssh-keygen -t ed25519 -N '' -C 'weg-portal deploy' -f weg_deploy"
                echo "::error::then put weg_deploy in this secret and pass weg_deploy.pub to"
                echo "::error::deploy/server-setup.sh --deploy-key." ;;
              *)
                echo "::error::DEPLOY_SSH_KEY is not a readable private key ($why)."
                echo "::error::It must be the whole PRIVATE key, BEGIN and END lines"
                echo "::error::included — not the .pub half." ;;
            esac
            exit 1
          fi

          # the pinned host key (secret DEPLOY_SSH_KNOWN_HOSTS, the output of
          # "ssh-keyscan <host>" checked once against the server) makes a
          # man-in-the-middle impossible; without it the key is read from
          # the network on every run and trusted blindly
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS is not set - the server's host key is not pinned (docs/deploy.md, 4.1)."
            ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach ${{ secrets.DEPLOY_SSH_HOST }} to read its host key."
            exit 1
          fi

      - name: Check the server is prepared
        run: |
          if ! ssh $SSH_OPTS "$TARGET" true; then
            echo "::error::The key is valid but the server rejected it. Run deploy/server-setup.sh"
            echo "::error::with --deploy-key and this public key on ${{ secrets.DEPLOY_SSH_HOST }}:"
            ssh-keygen -y -P "" -f ~/.ssh/deploy_key
            exit 1
          fi
          if ! ssh $SSH_OPTS "$TARGET" "$CTL status"; then
            echo "::error::weg-portal-ctl is not available for ${{ secrets.DEPLOY_SSH_USER }}."
            echo "::error::Prepare the server once with deploy/server-setup.sh (docs/deploy.md, 2)."
            exit 1
          fi

      # the server's CPU decides between the amd64 (Hetzner CX/CPX) and arm64
      # (Hetzner CAX) binary; the checksum comes from the release
      - name: Download the release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(ssh $SSH_OPTS "$TARGET" uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::unsupported server architecture"; exit 1 ;;
          esac
          file="weg-portal-$VERSION-linux-$arch"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" -p "$file" -p SHA256SUMS
          grep " $file\$" SHA256SUMS | sha256sum -c -
          echo "FILE=$file" >> "$GITHUB_ENV"

      # weg-portal-ctl verifies the version, backs up pb_data (service
      # stopped for a few seconds), switches, waits for health and rolls
      # back binary and data if the new version does not come up
      - name: Deploy
        run: |
          rsync -az -e "ssh $SSH_OPTS" "$FILE" "$TARGET:/srv/weg-portal/incoming/weg-portal-$VERSION"
          ssh $SSH_OPTS "$TARGET" "$CTL deploy '$VERSION'"

      - name: Check from outside
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DEPLOY_HOST }}/api/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::The portal runs on the server but https://${{ vars.DEPLOY_HOST }} is not reachable."
          echo "::error::Check DNS, the Hetzner firewall (80/443) and Caddy (journalctl -u caddy)."
          exit 1
